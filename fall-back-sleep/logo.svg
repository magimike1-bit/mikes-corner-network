  <circle cx="256" cy="252" r="86" fill="#f6b73e" stroke="#d18f1f" stroke-width="7"/>
  <g fill="#d18f1f">
    <circle cx="256" cy="182" r="6"/>
    <circle cx="316" cy="212" r="6"/>
    <circle cx="326" cy="252" r="6"/>
    <circle cx="316" cy="292" r="6"/>
    <circle cx="256" cy="322" r="6"/>
    <circle cx="196" cy="292" r="6"/>
    <circle cx="186" cy="252" r="6"/>
    <circle cx="196" cy="212" r="6"/>
  </g>
  <g stroke="#b97a12" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="252" x2="218" y2="214"/>
    <line x1="256" y1="252" x2="296" y2="222"/>
  </g>
  <circle cx="256" cy="252" r="10" fill="#b97a12"/>
