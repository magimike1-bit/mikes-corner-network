      <stop offset="0" stop-color="#27336e"/>
      <stop offset="1" stop-color="#3d4c9e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- crescent moon bowl (outer circle minus offset inner circle) -->
