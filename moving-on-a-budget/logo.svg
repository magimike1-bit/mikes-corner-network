<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Moving on a Budget logo">
  <rect x="4" y="4" width="88" height="88" rx="18" fill="#fdf8f1"/>
  <!-- moving box -->
  <rect x="24" y="34" width="48" height="42" rx="5" fill="#c2571b"/>
  <rect x="24" y="34" width="48" height="42" rx="5" fill="none" stroke="#8a3a10" stroke-width="3"/>
  <!-- tape stripe -->
  <rect x="44" y="34" width="8" height="42" fill="#f6e7d7"/>
  <!-- lid line -->
  <line x1="24" y1="46" x2="72" y2="46" stroke="#8a3a10" stroke-width="3"/>
  <!-- coin slot -->
  <rect x="38" y="26" width="20" height="6" rx="3" fill="#8a3a10"/>
  <!-- coin dropping in -->
  <circle cx="48" cy="16" r="9" fill="#e8a93d" stroke="#8a3a10" stroke-width="2.5"/>
  <circle cx="48" cy="16" r="4.5" fill="none" stroke="#fdf8f1" stroke-width="2"/>
</svg>
